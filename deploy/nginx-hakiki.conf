# Replace hakiki.example.org and certificate paths with your domain.
server {
    listen 80;
    server_name hakiki.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hakiki.example.org;

    ssl_certificate /etc/letsencrypt/live/hakiki.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hakiki.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
